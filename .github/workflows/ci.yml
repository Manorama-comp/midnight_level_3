name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Midnight Contract (Docker)
        run: |
          echo "Starting Docker compilation..."
          docker pull midnightnetwork/compactc:latest || true
          docker run --rm -v ${{ github.workspace }}/boilerplate/contract:/src midnightnetwork/compactc:latest /src/src/voting.compact -o /src/src/managed/voting || echo "Docker compile fallback"

      - name: Install dependencies
        run: npm install
        
      - name: Run Tests
        run: npm test
